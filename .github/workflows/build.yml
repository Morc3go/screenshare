# Gera os instaladores do app (sem assinatura de código) para Windows, macOS e Linux.
#
# - A cada push na main: os arquivos ficam em Actions > (execução) > Artifacts.
# - Ao criar uma tag v* (ex.: git tag v2.0.0 && git push origin v2.0.0): também
#   publica uma Release com os instaladores para baixar.
name: Gerar app

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            alvo: --win
            nome: windows
          - os: macos-latest
            alvo: --mac --arm64 --x64
            nome: macos
          - os: ubuntu-latest
            alvo: --linux
            nome: linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Gerar instaladores
        run: npx electron-builder ${{ matrix.alvo }} --publish never
        env:
          # Sem certificado: o build não tenta assinar.
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - uses: actions/upload-artifact@v4
        with:
          name: compartilha-tela-${{ matrix.nome }}
          path: |
            dist/*.exe
            dist/*.dmg
            dist/*.AppImage
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: instaladores
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: instaladores/*
          generate_release_notes: true
