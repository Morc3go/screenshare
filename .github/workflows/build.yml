# Gera os instaladores do app (sem assinatura de código) para Windows, macOS e Linux e
# publica uma Release quando a versão do package.json muda.
#
# O app instalado procura atualizações nas Releases (electron-updater): por isso cada Release
# leva, além dos instaladores, os arquivos latest*.yml e *.blockmap.
#
# Para lançar uma versão: aumente "version" no package.json e faça push na main.
# Push sem mudar a versão só gera os arquivos em Actions > Artifacts.
name: Gerar app

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            alvo: --win
            nome: windows
          - os: macos-latest
            alvo: --mac --arm64 --x64
            nome: macos
          - os: ubuntu-latest
            alvo: --linux
            nome: linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Gerar instaladores
        run: npx electron-builder ${{ matrix.alvo }} --publish never
        env:
          # Sem certificado: o build não tenta assinar.
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - uses: actions/upload-artifact@v4
        with:
          name: compartilha-tela-${{ matrix.nome }}
          path: |
            dist/*.exe
            dist/*.dmg
            dist/*.zip
            dist/*.AppImage
            dist/*.blockmap
            dist/latest*.yml
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Ver se esta versão já foi lançada
        id: versao
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          versao="v$(node -p "require('./package.json').version")"
          echo "tag=$versao" >> "$GITHUB_OUTPUT"
          if gh release view "$versao" >/dev/null 2>&1; then
            echo "Release $versao já existe; nada a publicar."
            echo "nova=false" >> "$GITHUB_OUTPUT"
          else
            echo "nova=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/download-artifact@v4
        if: steps.versao.outputs.nova == 'true'
        with:
          path: instaladores
          merge-multiple: true

      - name: Publicar Release
        if: steps.versao.outputs.nova == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.versao.outputs.tag }}" instaladores/* \
            --target "${{ github.sha }}" \
            --title "Compartilha Tela ${{ steps.versao.outputs.tag }}" \
            --generate-notes
